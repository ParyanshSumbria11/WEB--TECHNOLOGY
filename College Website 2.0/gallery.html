<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="collegewebsite.css">

<body>

    <header class="site-header">
        <div class="logo-section">
            <img src="https://imgs.search.brave.com/ff5zukB70PFKq2ZLllm5NkbCuciYUW7cAJPf2-rPd1M/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9tYW5h/Z2UuY29sbG5vZC5j/b20vVXBsb2FkL0Nv/bnRlbnQvd2ViX2lt/Z18wXzRfNF8yMDI2/XzEwXzQ4XzYuSlBH" alt="College Logo">

                <h1>Government College of Engineering and Technology, Jammu</h1>
                <h3>(Autonomous College)</h3>
            </div>
        </div>

        <div class="header-actions">
            <button type="button" id="themeButton" class="theme-toggle-btn">Dark Mode</button>
            <a href="loginform.html" class="header-login">Login</a>
        </div>
    </header>

    <div class="nav-wrapper">
        <button type="button" id="menuToggle" class="menu-toggle">☰ Menu</button>
        <nav id="mainNav">
            <a href="home.html">Home</a>
            <a href="about.html">About</a>
            <a href="faculty.html">Faculty</a>
            <a href="students.html">Students</a>
            <a href="admission.html">Admission</a>
            <a href="gallery.html" class="active">Photo Gallery</a>
        </nav>
    </div>

    <section class="gallery">
        <h2>Photo Gallery</h2>
        <div class="line"></div>

        <div class="gallery-grid">
            <div class="photo">
                <img src="https://gcetj.ac.in/photos/college-building/adm.jpg" alt="College Building">
                <p>College Building</p>
            </div>

            <div class="photo">
                <img src="https://gcetj.ac.in/photos/induction/INDUCTION PROG.jpeg" alt="Induction Program 2025">
                <p>Induction Program 2025</p>
            </div>

            <div class="photo">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTyvpZ3VQTyJC4GNc6eWzdVIUiGykC9fLZmi3kBP3XJIQ&s=10" alt="NCEEITET-2026">
                <p>NCEEITET-2026</p>
            </div>

            <div class="photo">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRhD3lSEshzeyEreY2g9BbOk9ooON6HxkdlxyzBbgSIcw&s=10" alt="FAREWELL">
                <p>FAREWELL</p>
            </div>

            <div class="photo">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSGXNGFOhuMxG_V_74jJh3qUXay85pHGl_cXM8FYDeN3g&s=10" alt="Sports Day">
                <p>Sports Day</p>
            </div>

            <div class="photo">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQCV3BGykl3y4OgUxjhwwOnJpmD7g52THf_2a07JRSJYg&s=10" alt="Plantation Drive">
                <p>Plantation Drive</p>
            </div>
        </div>
    </section>

    <div id="galleryLightbox" class="lightbox">
        <div class="lightbox-content">
            <button type="button" id="lightboxClose" class="lightbox-close">&times;</button>
            <img id="lightboxImg" src="" alt="Enlarged Photo">
            <p id="lightboxCaption"></p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 GCET Jammu. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
