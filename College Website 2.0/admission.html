<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission Form | GCET Jammu</title>
    <link rel="stylesheet" href="collegewebsite.css">
</head>

<body>

    <header class="site-header">
        <div class="logo-section">
            <img src="https://imgs.search.brave.com/ff5zukB70PFKq2ZLllm5NkbCuciYUW7cAJPf2-rPd1M/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9tYW5h/Z2UuY29sbG5vZC5j/b20vVXBsb2FkL0Nv/bnRlbnQvd2ViX2lt/Z18wXzRfNF8yMDI2/XzEwXzQ4XzYuSlBH" alt="College Logo">
            <div>
                <h1>Government College of Engineering and Technology, Jammu</h1>
                <h3>(Autonomous College)</h3>
            </div>
        </div>

        <div class="header-actions">
            <button type="button" id="themeButton" class="theme-toggle-btn">Dark Mode</button>
            <a href="loginform.html" class="header-login">Login</a>
        </div>
    </header>

    <div class="nav-wrapper">
        <button type="button" id="menuToggle" class="menu-toggle">☰ Menu</button>
        <nav id="mainNav">
            <a href="home.html">Home</a>
            <a href="about.html">About</a>
            <a href="faculty.html">Faculty</a>
            <a href="students.html">Students</a>
            <a href="admission.html" class="active">Admission</a>
            <a href="gallery.html">Photo Gallery</a>
        </nav>
    </div>

    <main>
        <h2>Student Admission Form</h2>
        <div class="under-line"></div>

        <form id="admissionForm" novalidate>
            <div class="form-group">
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" placeholder="Enter your full name">
                <span id="nameError" class="error-text"></span>
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" placeholder="example@domain.com">
                <span id="emailError" class="error-text"></span>
            </div>

            <div class="form-group">
                <label for="phone">Mobile Number (10 digits):</label>
                <input type="tel" id="phone" placeholder="Enter 10-digit mobile number">
                <span id="phoneError" class="error-text"></span>
            </div>

            <div class="form-group">
                <label>Gender:</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="Male"> Male</label>
                    <label><input type="radio" name="gender" value="Female"> Female</label>
                    <label><input type="radio" name="gender" value="Other"> Other</label>
                </div>
                <span id="genderError" class="error-text"></span>
            </div>

            <div class="form-group">
                <label for="course">Select Course / Branch:</label>
                <select id="course">
                    <option value="">-- Select Branch --</option>
                    <option value="B.Tech CSE">B.Tech Computer Science &amp; Engineering</option>
                    <option value="B.Tech ECE">B.Tech Electronics &amp; Communication</option>
                    <option value="B.Tech EE">B.Tech Electrical Engineering</option>
                    <option value="B.Tech ME">B.Tech Mechanical Engineering</option>
                    <option value="B.Tech CE">B.Tech Civil Engineering</option>
                </select>
                <span id="courseError" class="error-text"></span>
            </div>

            <div class="form-buttons">
                <button type="submit" class="btn-primary">Submit Application</button>
                <button type="button" id="admissionResetBtn" class="btn-secondary">Reset</button>
            </div>

            <p id="admissionStatus" class="form-status"></p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 GCET Jammu. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
